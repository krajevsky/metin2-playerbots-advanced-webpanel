<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ panel_brand }} · Seban Panel</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body class="login"><form method="post" class="login-card"><div class="brand">{{ panel_brand }}<span>Seban Control Center</span></div><h1>Panel administracyjny</h1>{% with messages=get_flashed_messages(with_categories=true) %}{% for _, message in messages %}<div class="flash error">{{message}}</div>{% endfor %}{% endwith %}<label>Hasło administratora<input autofocus type="password" name="password" required></label><button>Zaloguj</button></form></body></html>
