<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ panel_brand }} · Seban Panel</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">{% set laka = settings.theme == 'laka' %}{% if laka %}<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800&family=Cinzel:wght@600;700;900&display=swap"><link rel="stylesheet" href="{{ static_asset_url('laka.css') }}">{% endif %}</head><body class="login login--seban{% if laka %} laka-login{% endif %}"{% if laka %} data-skin="laka"{% endif %}><form method="post" class="login-card"><img class="login-project-logo" src="{{ url_for('static', filename='branding/seban-webpanel-banner.png') }}" alt="Seban WEBPANEL · Playerbots Control Center"><div class="brand">{{ panel_brand }}<span>Seban Control Center</span></div><h1>Panel administracyjny</h1>{% with messages=get_flashed_messages(with_categories=true) %}{% for _, message in messages %}<div class="flash error">{{message}}</div>{% endfor %}{% endwith %}<label>Hasło administratora<input autofocus type="password" name="password" required></label><button>Zaloguj</button></form></body></html>
