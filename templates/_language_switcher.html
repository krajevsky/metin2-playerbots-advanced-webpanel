<form class="laka-language" action="{{ url_for('set_language') }}" method="post">
  <input type="hidden" name="next" value="{{ request.full_path }}">
  <label for="{{ language_switcher_id }}">{{ 'Language' if ui_language == 'en' else 'Język' }}</label>
  <select id="{{ language_switcher_id }}" name="language" aria-label="{{ 'Panel language' if ui_language == 'en' else 'Język panelu' }}" onchange="this.form.requestSubmit()">
    <option value="pl"{% if ui_language == 'pl' %} selected{% endif %}>🇵🇱 Polish</option>
    <option value="en"{% if ui_language == 'en' %} selected{% endif %}>🇬🇧 English</option>
  </select>
  <button type="submit" class="laka-language-submit">{{ 'Apply' if ui_language == 'en' else 'Zastosuj' }}</button>
</form>
