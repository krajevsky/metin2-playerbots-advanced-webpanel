{% extends 'v2/base.html' %}{% block title %}{{item.item_name}} · Gospodarka{% endblock %}
{% block page_title %}{{item.item_name}}{% endblock %}
{% block content %}
<a href="{{url_for('economy')}}" style="color:var(--accent-soft);font-size:var(--fs-sm);display:inline-block;margin-bottom:var(--sp-3)">← Wróć do gospodarki</a>
<p class="muted" style="margin:0 0 var(--sp-3)">VNUM {{item.vnum}}</p>
<div class="v2-card"><h2>Stan w gospodarce · ostatnie 14 dni</h2><canvas id="item-history" height="90"></canvas></div>
<script>new Chart(document.getElementById('item-history'),{type:'line',data:{labels:{{history|map(attribute='captured_at')|list|tojson}},datasets:[{label:'Sztuki na serwerze',data:{{history|map(attribute='amount')|list|tojson}},borderColor:'#fbbf24',backgroundColor:'#fbbf2422',fill:true,tension:.25,pointRadius:0}]},options:{plugins:{legend:{labels:{color:'#99a2b5'}}},scales:{x:{ticks:{color:'#596178',maxTicksLimit:12}},y:{ticks:{color:'#596178'}}}}});</script>
{% endblock %}
